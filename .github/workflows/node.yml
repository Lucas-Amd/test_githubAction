name: Installer Node.js 18

on:
  workflow_dispatch:

jobs:
  install-node:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Afficher la version de Node.js
        run: node --version
