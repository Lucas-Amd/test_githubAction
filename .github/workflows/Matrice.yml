name: Matrix

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Correction 1 : Utilisation de bash pour contourner les droits d'exécution
      - run: bash build.sh

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        browser: [Chrome, Edge, Firefox]
    steps:
      # Correction 2 : Remplacement du script inexistant par la commande echo
      - run: echo "Exécution du test sur l'OS ${{ matrix.os }} avec le navigateur ${{ matrix.browser }}"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Déploiement effectué avec succès !"
